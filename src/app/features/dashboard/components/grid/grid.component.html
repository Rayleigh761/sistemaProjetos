<div class="container-global">
  <div class="container-table">
      <mat-form-field appearance="outline" class="filter">
        <mat-label>Filtro</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="N Projeto" #input class="inputFilter">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8  demo-table" matSort>
        <ng-container *ngFor="let column of displayedTableColumns" [matColumnDef]="column.field">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ column.header }} </th>
          <td mat-cell *matCellDef="let element; let j = index" (click)="openDialog(element.cd_solicitacao)">
            <div [ngClass]="column.field === 'ds_status' ? (element.ds_status | statusClass) : ''">{{ element[column.field] }} </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell tdDescricao" colspan="6">Nenhum dado correspondente ao filtro: "{{input.value}}"</td>
        </tr>
      </table>
      <mat-paginator class="mat-elevation-paginator mat-cell disable-pagination" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements"></mat-paginator>
  </div>
</div>
